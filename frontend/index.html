
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Online Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        header {
            background: #172337;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h2 { color: #ffdd57; font-size: 26px; }

        nav {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a { color: white; text-decoration: none; }

        nav a:hover { color: #ffdd57; }

        .nav-button {
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
        }

        .login-btn { background: white; color: #172337 !important; }
        .register-btn { background: #ff9f00; color: white !important; }

        .cart {
            background: #ffdd57;
            color: #172337;
            padding: 9px 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        .hero {
            background: #2874f0;
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        .hero h1 { font-size: 36px; margin-bottom: 12px; }

        .search {
            margin-top: 22px;
            padding: 12px;
            width: 280px;
            max-width: 90%;
            border: none;
            border-radius: 5px;
        }

        .products { padding: 40px 7%; }

        .products h2 { margin-bottom: 25px; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px #00000012;
        }

        .product-image { font-size: 65px; padding: 20px; }

        .card h3 { margin: 12px 0; }

        .price {
            color: #2874f0;
            font-size: 20px;
            font-weight: bold;
            margin: 12px 0;
        }

        button {
            background: #ff9f00;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #e68a00; }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        .status {
            margin-bottom: 20px;
            color: #555;
        }

        footer {
            background: #172337;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            header { justify-content: center; text-align: center; }
            nav { justify-content: center; gap: 12px; }
            .hero h1 { font-size: 28px; }
        }
    </style>
</head>

<body>

<header>
    <h2>ShopEasy</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="#products">Products</a>
        <a href="login.html" class="nav-button login-btn">Login</a>
        <a href="register.html" class="nav-button register-btn">Register</a>
        <a href="#cart" class="cart">
            🛒 Cart: <span id="cartCount">0</span>
        </a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to ShopEasy</h1>
    <p>Discover amazing products at great prices!</p>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search products..."
        oninput="searchProducts()"
    >
</section>

<section class="products" id="products">
    <h2>Our Products</h2>

    <p class="status" id="status">Loading products...</p>

    <div class="product-grid" id="productList"></div>
</section>

<section class="products" id="cart">
    <h2>Your Shopping Cart</h2>
    <div id="cartItems"></div>
    <h3 id="cartTotal">Total: ₹0.00</h3>
</section>

<footer>
    <p>© 2026 ShopEasy. All Rights Reserved.</p>
    <p>Online Shopping Made Easy!</p>
</footer>

<script>
    const PRODUCT_API = "http://54.173.242.63:3002/products";

    let products = [];
    let cart = JSON.parse(localStorage.getItem("shoppingCart") || "[]");

    function formatPrice(price) {
        return Number(price).toLocaleString("en-IN", {
            style: "currency",
            currency: "INR"
        });
    }

    async function loadProducts() {
        const status = document.getElementById("status");

        try {
            const response = await fetch(PRODUCT_API);

            if (!response.ok) {
                throw new Error("Unable to fetch products");
            }

            products = await response.json();

            status.innerText = products.length
                ? "Products loaded successfully."
                : "No products available. Please check again later.";

            displayProducts(products);

        } catch (error) {
            status.innerText =
                "Unable to load products. Please check Product Service and CORS settings.";

            console.error(error);
        }
    }

    function displayProducts(items) {
        const productList = document.getElementById("productList");

        productList.innerHTML = "";

        items.forEach(product => {
            const card = document.createElement("div");
            card.className = "card";

            const image = document.createElement("div");
            image.className = "product-image";
            image.textContent = "🛍️";

            const name = document.createElement("h3");
            name.textContent = product.name;

            const description = document.createElement("p");
            description.textContent = product.description || "";

            const price = document.createElement("div");
            price.className = "price";
            price.textContent = formatPrice(product.price);

            const stock = document.createElement("p");
            stock.textContent = "Stock: " + product.stock;

            const button = document.createElement("button");
            button.textContent = Number(product.stock) > 0
                ? "Add to Cart"
                : "Out of Stock";
            button.disabled = Number(product.stock) <= 0;
            button.addEventListener("click", () => addToCart(product.id));

            card.append(image, name, description, price, stock, button);
            productList.appendChild(card);
        });
    }

    function searchProducts() {
        const value = document.getElementById("search")
            .value.toLowerCase();

        const filtered = products.filter(product =>
            product.name.toLowerCase().includes(value)
        );

        displayProducts(filtered);
    }

    function addToCart(productId) {
        const product = products.find(p => p.id === productId);

        if (!product) return;

        const existing = cart.find(item => item.id === productId);

        const quantity = existing ? existing.quantity + 1 : 1;

        if (quantity > Number(product.stock)) {
            alert("Not enough stock available!");
            return;
        }

        if (existing) {
            existing.quantity++;
        } else {
            cart.push({
                id: product.id,
                name: product.name,
                price: Number(product.price),
                quantity: 1
            });
        }

        saveCart();
        alert("Product added to cart!");
    }

    function saveCart() {
        localStorage.setItem("shoppingCart", JSON.stringify(cart));
        displayCart();
    }

    function displayCart() {
        const cartItems = document.getElementById("cartItems");
        cartItems.innerHTML = "";

        let total = 0;
        let count = 0;

        cart.forEach(item => {
            const row = document.createElement("p");
            row.style.margin = "12px 0";

            const subtotal = item.price * item.quantity;
            total += subtotal;
            count += item.quantity;

            const details = document.createElement("span");
            details.textContent =
                `${item.name} | ${formatPrice(item.price)} | Qty: ${item.quantity} | Subtotal: ${formatPrice(subtotal)} `;

            const remove = document.createElement("button");
            remove.textContent = "Remove";
            remove.addEventListener("click", () => removeFromCart(item.id));

            row.append(details, remove);
            cartItems.appendChild(row);
        });

        if (cart.length === 0) {
            cartItems.textContent = "Your cart is empty.";
        }

        document.getElementById("cartCount").innerText = count;
        document.getElementById("cartTotal").innerText =
            "Total: " + formatPrice(total);
    }

    function removeFromCart(productId) {
        cart = cart.filter(item => item.id !== productId);
        saveCart();
    }

    loadProducts();
    displayCart();
</script>

</body>
</html>
