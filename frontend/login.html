<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 350px;
            max-width: 90%;
            border-radius: 10px;
            box-shadow: 0 2px 12px #0002;
            text-align: center;
        }

        h2 {
            color: #172337;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2874f0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 12px;
        }

        button:disabled {
            background: #999;
        }

        a {
            color: #2874f0;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>ShopEasy Login</h2>

    <p>Welcome back!</p>

    <form id="loginForm">

        <input type="email" id="email"
               placeholder="Enter Email" required>

        <input type="password" id="password"
               placeholder="Enter Password" required>

        <button type="submit" id="loginButton">Login</button>

    </form>

    <p id="message"></p>

    <p>Don't have an account?
        <a href="register.html">Register</a>
    </p>

    <p><a href="index.html">Back to Home</a></p>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.innerText = "Logging in...";
    message.style.color = "blue";
    message.innerText = "Connecting to server...";

    try {
        const response = await fetch("http://100.48.89.167:3001/users/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        console.log("Login response:", response.status, data);

        if (response.ok && data.token) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));

            message.style.color = "green";
            message.innerText = "Login successful! Redirecting...";

            setTimeout(function() {
                window.location.replace("index.html");
            }, 1500);

        } else {
            message.style.color = "red";
            message.innerText = data.message || "Login failed";

            button.disabled = false;
            button.innerText = "Login";
        }

    } catch (error) {
        console.error("Login error:", error);

        message.style.color = "red";
        message.innerText = "Unable to connect. Check browser Console.";

        button.disabled = false;
        button.innerText = "Login";
    }
});
</script>

</body>
</html>
